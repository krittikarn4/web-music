<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เพลงประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Mono:wght@400;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #17131F;
    --bg-1: #221C30;
    --card: #2A2138;
    --gold: #E3A857;
    --gold-dim: #B9863F;
    --rose: #D98A9B;
    --cream: #F3ECDE;
    --muted: #9A90A8;
    --line: rgba(243, 236, 222, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--bg-0);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(227, 168, 87, 0.08), transparent 40%),
      radial-gradient(circle at 85% 88%, rgba(217, 138, 155, 0.07), transparent 45%);
    color: var(--cream);
    font-family: 'Noto Sans Thai', 'Space Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .page {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 26px;
    letter-spacing: 0.01em;
    margin: 0;
    text-align: center;
    color: var(--cream);
  }

  h1 .sub {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--gold-dim);
    margin-top: 6px;
    font-weight: 400;
  }

  .tape {
    width: 100%;
    background: linear-gradient(180deg, var(--card), #241D33);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 20px 18px;
    position: relative;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6);
  }

  .tape::before {
    content: "";
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border: 1px solid rgba(243, 236, 222, 0.06);
    border-radius: 12px;
    pointer-events: none;
  }

  .reels {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 26px 20px;
  }

  .reel svg { display: block; }
  .reel circle.rim { fill: none; stroke: var(--gold-dim); stroke-width: 2; opacity: 0.55; }
  .reel circle.hub { fill: var(--bg-0); stroke: var(--gold); stroke-width: 2; }
  .reel .spoke { stroke: var(--gold); stroke-width: 2; stroke-linecap: round; }

  .reel.spinning svg {
    animation: spin 1.1s linear;
  }

  @keyframes spin {
    to { transform: rotate(300deg); }
  }

  .window {
    background: #100D18;
    border: 1px solid rgba(243, 236, 222, 0.1);
    border-radius: 6px;
    padding: 2px;
  }

  .window iframe {
    display: block;
    width: 100%;
    height: 168px;
    border: none;
    border-radius: 3px;
    background: #0B0910;
  }

  .label-strip {
    margin-top: 16px;
    border-top: 1px dashed var(--line);
    padding-top: 14px;
    text-align: center;
  }

  .counter {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--gold-dim);
    margin: 0 0 8px;
  }

  #song {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--cream);
    margin: 0;
    min-height: 24px;
    line-height: 1.4;
    letter-spacing: 0.01em;
  }

  #song .artist {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }

  #song.placeholder {
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 14px;
    color: var(--muted);
    font-weight: 400;
  }

  button#randomButton {
    margin-top: 14px;
    width: 100%;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 13px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, transform 0.08s ease;
  }

  button#randomButton:hover {
    background: var(--gold);
    color: #1A1420;
  }

  button#randomButton:active {
    transform: scale(0.97);
  }

  .hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="page">
  <h1>เพลงประจำวัน<span class="sub">DAILY MIXTAPE · SIDE A</span></h1>

  <div class="tape">
    <div class="reels">
      <div class="reel" id="reelLeft">
        <svg width="54" height="54" viewBox="0 0 54 54">
          <circle class="rim" cx="27" cy="27" r="24" />
          <circle class="hub" cx="27" cy="27" r="9" />
          <line class="spoke" x1="27" y1="27" x2="27" y2="14" />
          <line class="spoke" x1="27" y1="27" x2="38.4" y2="33.5" />
          <line class="spoke" x1="27" y1="27" x2="15.6" y2="33.5" />
        </svg>
      </div>
      <div class="reel" id="reelRight">
        <svg width="54" height="54" viewBox="0 0 54 54">
          <circle class="rim" cx="27" cy="27" r="24" />
          <circle class="hub" cx="27" cy="27" r="9" />
          <line class="spoke" x1="27" y1="27" x2="27" y2="14" />
          <line class="spoke" x1="27" y1="27" x2="38.4" y2="33.5" />
          <line class="spoke" x1="27" y1="27" x2="15.6" y2="33.5" />
        </svg>
      </div>
    </div>

    <div class="window" id="windowBox">
      <p class="placeholder" style="padding: 24px 16px; margin: 0; font-family: 'Noto Sans Thai', sans-serif; font-size: 14px; color: var(--muted); font-weight: 400; text-align: center;">แตะปุ่มด้านล่างเพื่อสุ่มเพลงประจำวัน</p>
    </div>

    <div class="label-strip">
      <p class="counter" id="counter">TRACK — / 30</p>
      <p id="song" class="placeholder"></p>
    </div>
  </div>

  <button id="randomButton">สุ่มเพลง</button>
  <p class="hint">เพลง 30 เพลง หมุนวนทุกครั้งที่กด</p>
</div>

<script>
  const songs = [
    { title: "About You", artist: "The 1975", videoId: "tGv7CUutzqU" },
    { title: "I Wanna Be Yours", artist: "Arctic Monkeys", videoId: "nyuo9-OjNNg" },
    { title: "Secret Door", artist: "", videoId: "rZklmdWvEvE" },
    { title: "Perfect Pair", artist: "beabadoobee", videoId: "3WpdCZC9q6w" },
    { title: "Love", artist: "wave to earth", videoId: "Q49pnA4jsp8" },
    { title: "ฝนตกไหม", artist: "Three Man Down", videoId: "ENnGPkhVu2g" },
    { title: "ถ้าเธอรักฉันจริง", artist: "Three Man Down", videoId: "JBAuRoIRAs8" },
    { title: "Birdsong", artist: "Dept feat. LANDOKMAI", videoId: "YklfbF_qdfM" },
    { title: "17", artist: "Dept", videoId: "6QdC2thAUUg" },
    { title: "Just One Thing", artist: "Solitude Is Bliss", videoId: "vg0ihcNtc1s" },
    { title: "คิดถึงเธอกลางวันฝันถึงเธอกลางคืน", artist: "Ink Waruntorn", videoId: "q2R0iOF3j-Y" },
    { title: "เวลาเธอยิ้ม", artist: "Polycat", videoId: "mVT1SNc_t2Q" },
    { title: "ไม่รักดีกว่า", artist: "Z9", videoId: "RrWFlqoWIHY" },
    { title: "ฉันมันเป็นใคร", artist: "Tilly Birds", videoId: "CFMXSWTKy68" },
    { title: "คิดถึงไปก่อน", artist: "Bomb at Track feat. Alien Safeplanet", videoId: "zxhGfUE7_h0" },
    { title: "Me(Flower)You", artist: "_Less", videoId: "I-kYzPaULL0" },
    { title: "Flowers", artist: "Tofu", videoId: "fZeDuzJTRqk" },
    { title: "อย่าเลย", artist: "Tea for Three", videoId: "7JBHgxwyCEU" },
    { title: "Still Cry", artist: "Sweet Mullet", videoId: "eHNwbXqxqgA" },
    { title: "บ้านผีปลอบ", artist: "Tattoo Colour", videoId: "v7hts-62q3I" },
    { title: "คำบางคำ", artist: "Sqweez Animal", videoId: "UjdSWng-qvE" },
    { title: "ฉันไม่เหงา", artist: "Sqweez Animal", videoId: "qRQylCo7Q9g" },
    { title: "นักมายากล", artist: "Paradox", videoId: "LwQ1KF6xHwU" },
    { title: "หว่าเว้", artist: "The Jukks", videoId: "HfH8n0_T0_Y" },
    { title: "ดั่งที่ถูกกำหนดไว้", artist: "Safeplanet", videoId: "r3MiUEqtKkk" },
    { title: "เปลี่ยนไปแต่เหมือนเดิม", artist: "Television Off", videoId: "A1QDe2EUDDE" },
    { title: "Kungfu Boy", artist: "Yew", videoId: "idYEk-kpue0" },
    { title: "ต้องทำเช่นไรให้ความรักเป็นนิรันดร์", artist: "Dept", videoId: "6svVVXX0b4A" },
    { title: "โอยา", artist: "Safeplanet", videoId: "Euwv23fEs5E" },
    { title: "ไม่มีเธอ", artist: "Retrospect", videoId: "sliitz3PSHI" },
  ];

  const songEl = document.getElementById('song');
  const counterEl = document.getElementById('counter');
  const windowBox = document.getElementById('windowBox');
  const reelLeft = document.getElementById('reelLeft');
  const reelRight = document.getElementById('reelRight');
  const button = document.getElementById('randomButton');

  let lastIndex = -1;

  function pickSong() {
    let idx = Math.floor(Math.random() * songs.length);
    if (songs.length > 1) {
      while (idx === lastIndex) {
        idx = Math.floor(Math.random() * songs.length);
      }
    }
    lastIndex = idx;
    return { idx, song: songs[idx] };
  }

  function render(idx, song) {
    songEl.classList.remove('placeholder');
    const artistLine = song.artist ? '<span class="artist">' + song.artist + '</span>' : '';
    songEl.innerHTML = song.title + artistLine;
    counterEl.textContent = 'TRACK ' + String(idx + 1).padStart(2, '0') + ' / ' + songs.length;

    windowBox.innerHTML =
      '<iframe src="https://www.youtube.com/embed/' + song.videoId +
      '?autoplay=1&rel=0" title="' + song.title +
      '" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
  }

  button.addEventListener('click', () => {
    reelLeft.classList.remove('spinning');
    reelRight.classList.remove('spinning');
    void reelLeft.offsetWidth;
    reelLeft.classList.add('spinning');
    reelRight.classList.add('spinning');

    const { idx, song } = pickSong();
    render(idx, song);
  });
</script>

</body>
</html>
